# Nginx reverse proxy for FitFlow. Replace fitflow.example.invalid with your domain.
# TLS certificates: e.g. `sudo certbot --nginx -d your.domain` (see docs/DEPLOYMENT.md).
limit_req_zone $binary_remote_addr zone=fitflow_auth:10m rate=10r/m;

server {
    listen 80;
    listen [::]:80;
    server_name fitflow.example.invalid;
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name fitflow.example.invalid;

    ssl_certificate     /etc/letsencrypt/live/fitflow.example.invalid/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fitflow.example.invalid/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    client_max_body_size 10m;   # progress photos are capped at 8 MB by the app
    proxy_read_timeout 120s;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;

    location ^~ /api/auth/ {
        limit_req zone=fitflow_auth burst=10 nodelay;
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/fitflow-proxy.conf;
    }

    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/fitflow-proxy.conf;
        expires 365d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/fitflow-proxy.conf;
    }
}
